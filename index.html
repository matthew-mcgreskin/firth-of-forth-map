  <style>
    :root {
      --navy: #0b1c2c;
      --navy-2: #12283d;
      --sea: #1a4a6e;
      --teal: #2a9d8f;
      --gold: #e9c46a;
      --sand: #f4e8c8;
      --foam: #e8f4f8;
      --ink: #0d1b26;
      --muted: #8aa0b3;
      --card: rgba(11, 28, 44, 0.92);
      --pin: #e76f51;
      --club: #4cc9f0;
      --event: #c77dff;
      --ntm: #f4a261;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--navy);
      color: var(--foam);
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: linear-gradient(180deg, rgba(11,28,44,0.92) 0%, rgba(11,28,44,0.55) 70%, transparent 100%);
      pointer-events: none;
    }
    header * { pointer-events: auto; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; color: #fff; }
    .brand span {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .toolbar button, .search {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--foam);
      border-radius: 8px;
      padding: 8px 12px;
      font: 500 13px "IBM Plex Sans", sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .toolbar button:hover { background: rgba(255,255,255,0.16); border-color: var(--gold); }
    .toolbar button.active-tool { background: var(--gold); color: var(--ink); border-color: var(--gold); }
    .search { width: 200px; outline: none; }
    .search:focus { border-color: var(--teal); }
    .filters {
      display: flex;
      gap: 6px;
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      background: rgba(11,28,44,0.82);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 5px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
    }
    .filters button {
      border: 0; background: transparent; color: var(--foam);
      font: 600 12px "IBM Plex Sans", sans-serif;
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .filters button.active { background: var(--gold); color: var(--ink); }
    #map {
      position: absolute; inset: 0;
      z-index: 1;
      background: #0a2233;
    }
    .leaflet-control-attribution {
      background: rgba(11,28,44,0.8) !important;
      color: #8aa0b3 !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: var(--gold) !important; }
    .leaflet-control-layers {
      background: rgba(11,28,44,0.92);
      color: var(--foam);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
    }
    .leaflet-control-layers label { font: 12px "IBM Plex Sans", sans-serif; }
    .leaflet-bar a {
      background: rgba(11,28,44,0.92) !important;
      color: var(--foam) !important;
      border-bottom-color: rgba(255,255,255,0.12) !important;
    }
    .list-panel {
      position: absolute;
      top: 72px; left: 16px;
      width: 250px;
      max-height: calc(100vh - 96px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      z-index: 2000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .list-panel h3 {
      padding: 14px 16px 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .port-list { overflow-y: auto; padding: 0 8px 12px; }
    .port-list button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--foam);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font: 500 13px "IBM Plex Sans", sans-serif;
    }
    .port-list button:hover, .port-list button.active { background: rgba(255,255,255,0.08); }
    .port-list .tag {
      font: 600 10px "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    .group-label {
      font: 600 10px "IBM Plex Mono", monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 10px 4px;
    }
    .panel {
      position: absolute;
      top: 72px; right: 16px;
      width: 380px;
      max-height: calc(100vh - 110px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      z-index: 2100;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .panel.open { display: flex; }
    .panel-head {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 16px 16px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .panel-head h2 { font-size: 18px; }
    .panel-head .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .panel-head .close {
      background: transparent; border: 0; color: var(--foam);
      font-size: 22px; cursor: pointer; line-height: 1;
    }
    .panel-body { overflow-y: auto; padding: 14px 16px 20px; font-size: 14px; line-height: 1.55; }
    .panel-body p { margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      background: rgba(42,157,143,0.18);
      border: 1px solid rgba(42,157,143,0.4);
      color: #9ee7dc;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .fact {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .fact dt { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .fact dd { font-size: 13px; margin-top: 2px; }
    .why-banner {
      background: rgba(233,196,106,0.12);
      border: 1px solid rgba(233,196,106,0.35);
      color: var(--sand);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .links a { color: var(--gold); }
    .legend {
      position: absolute;
      bottom: 28px; left: 278px;
      z-index: 2000;
      background: rgba(11,28,44,0.82);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 11px;
      display: flex; gap: 12px; flex-wrap: wrap;
      max-width: calc(100vw - 320px);
    }
    .legend i {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 5px; vertical-align: -1px;
    }
    .legend i.sq { border-radius: 2px; }
    .hint {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
    }
    .mk {
      background: transparent; border: 0;
    }
    .mk .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--pin);
      border: 2px solid #fff;
      box-shadow: 0 0 0 6px rgba(231,111,81,0.25);
    }
    .mk.major .dot { background: var(--gold); box-shadow: 0 0 0 6px rgba(233,196,106,0.28); }
    .mk.club .dot { background: var(--club); box-shadow: 0 0 0 6px rgba(76,201,240,0.28); }
    .mk.event .dot { background: var(--event); border-radius: 3px; box-shadow: 0 0 0 6px rgba(199,125,255,0.28); }
    .mk.ntm .dot { background: var(--ntm); border-radius: 3px; box-shadow: 0 0 0 6px rgba(244,162,97,0.28); }
    .mk.active .dot { transform: scale(1.25); }
    .leaflet-tooltip.pin-label {
      background: rgba(11,28,44,0.88);
      border: 0;
      color: #fff;
      font: 600 11px "IBM Plex Sans", sans-serif;
      box-shadow: none;
      padding: 2px 6px;
    }
    .leaflet-tooltip.pin-label::before { display: none; }


  </style>
</head>
<body>
  <div id="map"></div>
  <header>
    <div class="brand">

    <div><i style="background:#e76f51"></i> Harbour / terminal</div>

  <script>
const ports = [
      {
        id: "grangemouth",
        lat: 56.0205, lng: -3.708,
        name: "Grangemouth",
        kind: "major",
        type: "Commercial · container · liquid bulk",
        shore: "South / upper Forth",
        chips: ["Container", "Liquid bulk", "Freeport", "Rail-linked"],
        facts: [
          ["Throughput", "~9 Mt / year"],
          ["Containers", "250k+ TEU"],
          ["Trade value", "~£6 bn / year"],
          ["Reach", "70% of Scotland < 1 hr"]
        ],
        body: `<p><strong>Not a visitor yacht berth.</strong> If FTNS is asked for a leisure night alongside, do not send the yacht here — use the Visitor berths filter and point them at Granton, Port Edgar or a small harbour.</p>
        <p>Scotland’s largest port and the country’s principal container and reefer terminal. Cargo moving through Grangemouth is estimated to represent around 30% of Scottish GDP.</p>
        <p>Specialist terminals handle containers, clean oils, chemicals, LPG and general cargo. Seven weekly feeder services connect the port to European and deep-sea hubs used by the world’s top shipping lines.</p>
        <p>The site sits inside the Forth Green Freeport and is rail-linked to both East and West Coast main lines, with around 600,000 sq ft of warehousing and a 775 m rail siding.</p>`,
        link: "https://www.forthports.co.uk/our-ports/grangemouth/"
      },
      {
        id: "boness",
        lat: 56.0182, lng: -3.6095,
        name: "Bo'ness",
        kind: "minor",
        type: "Historic harbour · leisure",
        shore: "South shore",
        visitor: true,
        chips: ["Leisure", "Heritage", "Visitor enquiry"],
        facts: [
          ["Status", "Small harbour"],
          ["Note", "Not a Forth Ports commercial dock"]
        ],
        body: `<p>Bo’ness (Borrowstounness) sits on the south shore of the upper Forth. The historic harbour is now primarily leisure and heritage-oriented rather than a deep-water commercial terminal.</p>
        <p>The town is better known for the Bo’ness & Kinneil Railway and the nearby Kinneil House than for freight. Commercial traffic on this stretch of the firth is concentrated at Grangemouth a few miles west.</p>
        <p>For a visiting yacht, this is a possible leisure stop — not Grangemouth. Confirm depth, drying and contact before sending anyone here.</p>`
      },
      {
        id: "rosyth",
        lat: 56.0178, lng: -3.448,
        name: "Rosyth",
        kind: "major",
        type: "Commercial · cruise · agri · defence",
        shore: "North shore, Fife",
        chips: ["Cruise hub", "Agri-feed", "Ro-ro", "Defence"],
        facts: [
          ["Berths", "6 working berths"],
          ["Cargo", "250–550 kt / year"],
          ["Depth", "~8 m MLWS (N. Wall)"],
          ["Road", "2 miles from M90"]
        ],
        body: `<p><strong>Not a casual visitor yacht berth.</strong> Commercial, cruise, agri and defence traffic. A visiting leisure yacht looking for a night’s rest should be sent to Port Edgar, immediately east under the bridges — not into this dock.</p>
        <p>Forth Ports Rosyth sits on the north bank of the Forth, immediately west of the Forth Bridges, with deep-water river berths and the only ro-ro berth on Scotland’s east coast (floating linkspan, all-tide access).</p>
        <p>It has grown into a cruise turnaround hub and Scotland’s premier agri-feed hub, while remaining important for project cargo, automotive and defence mobilisation. The adjacent historic dockyard (Babcock) still supports naval work.</p>
        <p>North Wall offers a long deep-water frontage and heavy-lift cranage. The port is upstream of the bridges but can take deep-sea vessels.</p>`,
        link: "https://www.forthports.co.uk/our-ports/rosyth/"
      },
      {
        id: "queensferry",
        lat: 56.0075, lng: -3.305,
        name: "South Queensferry / Hound Point",
        kind: "minor",
        type: "Oil terminal · historic ferry point",
        shore: "South shore",
        chips: ["Crude oil", "SPM / jetty", "Heritage"],
        facts: [
          ["Hound Point", "Panamax crude terminal"],
          ["Operator", "Ineos / Forth system"],
          ["Note", "Not a general cargo port"]
        ],
        body: `<p>South Queensferry is the historic ferry crossing under the Forth Bridge. Commercial shipping interest here is dominated by <strong>Hound Point</strong>, the deep-water crude oil terminal just east of the bridges on the south shore.</p>
        <p>Hound Point loads North Sea crude from the Forties pipeline system onto tankers (typically Aframax / Panamax class). It is one of two specialised oil & gas marine terminals in the Forth managed within the Forth Ports statutory harbour area.</p>
        <p>The village itself is a visitor gateway to the three Forth bridges rather than a working cargo port.</p>`
      },
      {
        id: "leith",
        lat: 55.9815, lng: -3.171,
        name: "Leith (Edinburgh)",
        kind: "major",
        type: "Enclosed deep-water port · cruise · renewables",
        shore: "South shore",
        chips: ["Deep-water", "Cruise", "Offshore wind", "Dry docks"],
        facts: [
          ["Max ship", "~50,000 DWT"],
          ["Quayage", "4,000 m+ internal"],
          ["Cargo", ">1 Mt / year"],
          ["City", "3 miles from centre"]
        ],
        body: `<p><strong>Usually the wrong answer for a visiting sailing yacht.</strong> Leith is an enclosed commercial port. Cost, security and working traffic make it a poor first suggestion. FTNS should point leisure arrivals at Granton (RFYC / FCYC / Edinburgh Marina pontoon) or Port Edgar instead.</p>
        <p>Scotland’s largest enclosed deep-water port, on the south shore immediately north-east of Edinburgh. It can accept ships up to about 50,000 DWT and has two dry docks plus extensive inner basins.</p>
        <p>Leith is the capital’s cruise gateway (and home berth of the Royal Yacht Britannia) and a growing renewables / offshore-wind marshalling and manufacturing site, including the Charles Hammond deep-water berth and a large Freeport tax site.</p>
        <p>Cargo includes dry bulk, project cargo, agri-products, pipes and decommissioning work. Large cruise ships often use Forth anchorages and tender to Newhaven when the enclosed docks are constrained.</p>`,
        link: "https://www.forthports.co.uk/our-ports/leith-edinburgh/"
      },
      {
        id: "burntisland",
        lat: 56.0578, lng: -3.233,
        name: "Burntisland",
        kind: "major",
        type: "Natural harbour · fabrication · bulk",
        shore: "North shore, Fife",
        chips: ["Fabrication", "Bulk", "Renewables", "Freeport"],
        facts: [
          ["Character", "Oldest natural harbour on the Forth"],
          ["Tenants", "BiFab, Briggs Marine"],
          ["Role", "Fife satellite port"]
        ],
        body: `<p>One of the Forth’s oldest natural harbours, on the Fife shore opposite Leith. Forth Ports operates it as a Fife satellite port for dry bulk, breakbulk, paper & forest products, oil & gas support and offshore renewables.</p>
        <p>Burntisland Fabrications (BiFab) and Briggs Marine are long-standing tenants. The harbour is being positioned, with Leith, as a Mid-Forth pair for offshore-wind marshalling and component assembly under the Forth Green Freeport.</p>`,
        link: "https://www.forthports.co.uk/our-ports/fife-ports/"
      },
      {
        id: "kirkcaldy",
        lat: 56.1165, lng: -3.147,
        name: "Kirkcaldy",
        kind: "major",
        type: "General cargo · grain",
        shore: "North shore, Fife",
        chips: ["Grain", "Cereals", "Coasters"],
        facts: [
          ["Reopened", "2011 (commercial)"],
          ["Typical", "Coaster-sized vessels"],
          ["Role", "Fife satellite port"]
        ],
        body: `<p>Kirkcaldy Harbour on the north Forth handles standard general-cargo coasters, with a particular strength in grains and cereals. It reopened to commercial traffic in 2011 after a long gap.</p>
        <p>Together with Burntisland and Methil it forms Forth Ports’ Fife satellite cluster — smaller than Grangemouth or Leith but useful for regional bulk and agri cargoes.</p>`,
        link: "https://www.forthports.co.uk/our-ports/fife-ports/"
      },
      {
        id: "methil",
        lat: 56.184, lng: -3.005,
        name: "Methil",
        kind: "major",
        type: "Timber · bulk · energy",
        shore: "North shore, Fife",
        chips: ["Timber", "Aggregates", "Energy land"],
        facts: [
          ["Docks", "Two docks"],
          ["Max", "~3,000 DWT typical"],
          ["Land", "50 acres development"]
        ],
        body: `<p>The most easterly of the Fife ports, Methil has two docks and specialises in timber, wood pulp, aggregates, grain and general bulk. It is a national distribution point for timber merchants.</p>
        <p>Around 50 acres of development land and an energy / renewables hinterland make it relevant to decommissioning and offshore support as well as traditional bulk trades.</p>`,
        link: "https://www.forthports.co.uk/our-ports/fife-ports/"
      },
      {
        id: "northberwick",
        lat: 56.0612, lng: -2.7175,
        name: "North Berwick",
        visitor: true,
        kind: "minor",
        type: "Leisure · fishing · harbour",
        shore: "South shore, East Lothian",
        chips: ["Leisure", "Seabirds", "Bass Rock"],
        facts: [
          ["Use", "Harbour & marina"],
          ["Landmark", "Bass Rock offshore"]
        ],
        body: `<p>A small East Lothian harbour used by fishing boats, trip vessels to Bass Rock and the Isle of May, and leisure craft. It is not a commercial freight port.</p>
        <p>East Lothian Yacht Club races off this harbour and hosts the open and keelboat regattas. On those weekends the harbour is a racing base as well as a working haven — see the ELYC pins on the Clubs and Races layers.</p>
        <p>The town is a visitor centre for the outer Forth’s seabird colonies; Bass Rock is one of the world’s largest gannetries.</p>`
      },
      {
        id: "dunbar",
        lat: 56.0042, lng: -2.5165,
        name: "Dunbar",
        kind: "minor",
        type: "Fishing · leisure harbour",
        shore: "South shore, East Lothian",
        visitor: true,
        chips: ["Fishing", "Leisure"],
        facts: [
          ["Use", "Working harbour"],
          ["Coast", "Eastern limit of this chart"]
        ],
        body: `<p>Historic fishing harbour on the East Lothian coast at the eastern edge of this chart extract. Still a working harbour for inshore boats and leisure traffic rather than deep-sea cargo.</p>`
      },
      {
        id: "anstruther",
        lat: 56.2225, lng: -2.699,
        name: "Anstruther",
        kind: "minor",
        type: "Fishing harbour · East Neuk",
        shore: "North shore, Fife",
        visitor: true,
        chips: ["Fishing", "East Neuk"],
        facts: [
          ["Use", "Fisheries & visitor harbour"],
          ["Region", "East Neuk of Fife"]
        ],
        body: `<p>Principal harbour of the East Neuk of Fife. Traditionally a herring port, now a mix of inshore fishing, creel boats and visitor traffic. The Scottish Fisheries Museum sits on the harbour.</p>
        <p>Also a destination for Forth passage races and cruises-in-company from Granton. Those weekends are when a small harbour most needs a card that the arriving club, not a central team, has written.</p>`
      },
      {
        id: "inverkeithing",
        lat: 56.0315, lng: -3.3965,
        name: "Inverkeithing",
        kind: "minor",
        type: "Small harbour · shipbreaking heritage",
        shore: "North shore, Fife",
        chips: ["Heritage", "Inner Forth"],
        facts: [
          ["Nearby", "Rosyth / Forth Bridges"],
          ["History", "Famous shipbreaking yard"]
        ],
        body: `<p>A small Fife harbour immediately east of Rosyth. Inverkeithing was once one of Britain’s best-known shipbreaking yards (Thos. W. Ward). Today it is a minor harbour in the shadow of the commercial and naval facilities at Rosyth.</p>`
      },
      {
        id: "rfyc",
        lat: 55.9818, lng: -3.2275,
        name: "Royal Forth Yacht Club",
        kind: "club",
        layer: "club",
        type: "Keelboat · Dragon · cruiser racing",
        shore: "Granton Harbour, south shore",

const NTM_FEED_URL ="./data.json";

async function loadNtms() {

  try {

    const response = await fetch(NTM_FEED_URL);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const ntms = await response.json();

    const today = new Date();

    ntms.forEach(item => {

      if (
        item.endDate &&
        new Date(item.endDate) < today
      ) {
        return;
      }

      ports.push({
        id: `ntm-${item.ntmNumber}`,

        lat: Number(item.latitude),
        lng: Number(item.longitude),

        name: `NtM ${item.ntmNumber} · ${item.title}`,

        kind: "ntm",
        layer: "ntm",

        type: "Notice to Mariners",

        shore: item.area || "Firth of Forth",

        chips: [
          item.ntmNumber,
          item.status
        ].filter(Boolean),

        facts: [
          ["Status", item.status || ""],
          ["From", item.startDate || ""],
          ["Until", item.endDate || ""]
        ],

        body: `<p>${item.noticeText || ""}</p>`,

        link: item.sourceUrl || "",
        linkLabel: "Official Notice"
      });

    });

  } catch (err) {

    console.error(
      "Unable to load NtM feed",
      err
    );

  }

}

      const l = layerOf(p);
      if (l === "club") return "CLUB";
      if (l === "event") return "RACE";
      if (l === "ntm") return "NtM";
      return p.kind === "major" ? "PORT" : "HBR";
    }
    function classOf(p) {
      const l = layerOf(p);
      if (l === "club") return "club";
      if (l === "event") return "event";
      if (l === "ntm") return "ntm";
      return p.kind === "major" ? "major" : "";
    }
    function visiblePlaces(q = "") {
      const query = q.trim().toLowerCase();
      return ports.filter(p => {
        const layer = layerOf(p);
        if (activeFilter === "visitor") {
          if (!p.visitor) return false;
        } else if (activeFilter !== "all" && layer !== activeFilter) {
          return false;
        }
        if (!query) return true;
        const blob = [p.name, p.type, p.shore, ...(p.chips || [])].join(" ").toLowerCase();
        return blob.includes(query);
      });
    }

    function iconFor(p, active) {
      const cls = "mk " + classOf(p) + (active ? " active" : "");
      return L.divIcon({
        className: cls,
        html: '<div class="dot"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
    }

    function renderPins() {
      Object.values(markers).forEach(m => map.removeLayer(m));
      Object.keys(markers).forEach(k => delete markers[k]);
      const q = document.getElementById("search").value;
      visiblePlaces(q).forEach(p => {
        if (p.lat == null) return;
        const m = L.marker([p.lat, p.lng], { icon: iconFor(p, false), title: p.name });
        m.on("click", () => openPort(p.id));
        if (showLabels) {
          m.bindTooltip(p.name, { permanent: true, direction: "right", offset: [10, 0], className: "pin-label" });
        }
        m.addTo(map);
        markers[p.id] = m;
      });
    }

    function renderList(filter = "") {
      const q = filter;
      portList.innerHTML = "";
      const groups = [
        { key: "port", label: "Ports & harbours" },
        { key: "club", label: "Yacht clubs" },
        { key: "event", label: "Races & events" },
        { key: "ntm", label: "Notices to Mariners" }
      ];
      groups.forEach(g => {
        const items = visiblePlaces(q).filter(p => layerOf(p) === g.key);
        if (!items.length) return;
        const h = document.createElement("div");
        h.className = "group-label";
        h.textContent = g.label;
        portList.appendChild(h);
        items.forEach(p => {
          const b = document.createElement("button");
          b.dataset.id = p.id;
          b.innerHTML = `<span>${p.name}</span><span class="tag">${tagOf(p)}</span>`;
          b.addEventListener("click", () => {
            openPort(p.id);
            if (p.lat != null) map.panTo([p.lat, p.lng]);
          });
          portList.appendChild(b);
        });
      });
    }

    function openPort(id) {
      const p = id === "why" ? whyCard : ports.find(x => x.id === id);
      if (!p) return;
      Object.entries(markers).forEach(([mid, m]) => {
        const src = ports.find(x => x.id === mid);
        m.setIcon(iconFor(src, mid === id));
      });
      document.querySelectorAll("#portList button").forEach(el => el.classList.toggle("active", el.dataset.id === id));
      pTitle.textContent = p.name;
      pMeta.textContent = `${p.type}  ·  ${p.shore}` + (p.lat != null ? `  ·  ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}` : "");
      const chips = (p.chips || []).map(c => `<span class="chip">${c}</span>`).join("");
      const facts = (p.facts || []).map(([k,v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
      const link = p.link ? `<p class="links"><a href="${p.link}" target="_blank" rel="noopener">${p.linkLabel || "More information"} ↗</a></p>` : "";
      const why = p.visitor
        ? `<div class="why-banner">Visitor berth candidate. FTNS can send a leisure yacht here instead of a commercial Forth Ports dock — confirm availability with the harbour or club first.</div>`
        : (layerOf(p) === "port" && p.kind === "major"
          ? `<div class="why-banner">Commercial port. A visiting sailing yacht asking FTNS for a berth should usually be pointed at the Visitor berths filter, not here.</div>`
          : "");


      pBody.innerHTML = `${why}<div class="chips">${chips}</div>${p.body}<div class="facts">${facts}</div>${link}
        <p style="margin-top:12px;font-size:12px;color:#8aa0b3">Positions are approximate working-group placeholders on OSM / OpenSeaMap, not a surveyed chart datum. Always use official ENCs for navigation. OpenSeaMap marks are community-maintained. Berth availability is not live.</p>`;


panel.classList.add("open");

if (p.lat != null) {
    map.panTo([p.lat, p.lng]);
}
}

    function closePanel() {
      panel.classList.remove("open");
      document.querySelectorAll("#portList button.active").forEach(el => el.classList.remove("active"));
      Object.entries(markers).forEach(([mid, m]) => {
        const src = ports.find(x => x.id === mid);
        m.setIcon(iconFor(src, false));
      });
    }

    const whyCard = {
      id: "why",
      name: "Why this guide exists",
      type: "FTNS · visitor berths · Notices to Mariners",
      shore: "The whole Firth",
      chips: ["FTNS", "Visitor berths", "Notices to Mariners", "Leisure"],
      facts: [
        ["Who asks", "Leisure yachts, often from Europe"],
        ["Berth answer", "This guide, not a cargo dock"],
        ["Also", "Current Forth Notices to Mariners"],
        ["Owner of notices", "Forth Ports / FTNS"]
      ],
      body: `<div class="why-banner">Two jobs, one page: where a visiting yacht can lie, and which Notices to Mariners affect them on the way in.</div>
        <p>FTNS often hears from leisure users — a skipper coming up from the Continent on a sailing yacht, asking where they can lie for the night. The commercial Forth Ports docks are the wrong place: they are working terminals, they are rarely set up for a visiting yacht, and they are too expensive for that job.</p>
        <p>Tomorrow FTNS should be able to say: use this guide, open <strong>Visitor berths</strong>, pick Granton, Port Edgar, North Berwick, Anstruther or Dunbar, and call the number on the card.</p>
        <p>We are also looking to do this for <strong>Notices to Mariners</strong>. The official notice still comes from Forth Ports / FTNS. What we want is that same notice on this chart, on the water it applies to — so a skipper looking for a berth also sees works, exclusions or a buoy off station without hunting a separate PDF.</p>
        <p>Yacht clubs and small harbours sit on the working group because they own the berths. FTNS sits on it because they own the notices and they take the call.</p>`
    };



    document.getElementById("whyBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      openPort("why");
    });
    document.getElementById("closePanel").addEventListener("click", closePanel);
    document.getElementById("reset").addEventListener("click", () => {
      closePanel();
      document.getElementById("search").value = "";
      activeFilter = "all";
      document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));
      showLabels = false;
      map.fitBounds(forthBounds, { padding: [40, 40] });
      renderPins();
      renderList();
    });
    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b === btn));
      renderPins();
      renderList(document.getElementById("search").value);
    });
    document.getElementById("toggleLabels").addEventListener("click", () => {
      showLabels = !showLabels;
      document.getElementById("toggleLabels").classList.toggle("active-tool", showLabels);
      renderPins();
    });

    document.getElementById("search").addEventListener("input", (e) => {
      renderList(e.target.value);
      renderPins();
    });



    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closePanel();
      }
    });

loadNtms().then(() => {
  renderPins();
  renderList();
});

  </script>
</body>
</html>
